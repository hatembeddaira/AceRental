<div class="container-xxl">
    <h2>Liste des devis</h2>
    <div class="row">
        <div class="col-md-5">
            <table mat-table [dataSource]="dataSource" matSort (matSortChange)="announceSortChange($event)" class="mat-elevation-z8">
                <ng-container matColumnDef="id">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by number">
                    N° Devis
                    </th>
                    <td mat-cell *matCellDef="let element">
                        <a type="button" style="padding: 2px 5px;" (click)="generateDevis(element.id)"  class="btn btn-dark effect btn-xs">{{element.reference}}</a>
                        </td>
                </ng-container>
                <ng-container matColumnDef="nomClient">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by name">
                    Nom Client
                    </th>
                    <td mat-cell *matCellDef="let element">{{element.nomClient}}</td>
                </ng-container>
                <ng-container matColumnDef="prenomClient">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by name">
                    Prénom Client
                    </th>
                    <td mat-cell *matCellDef="let element"> {{element.prenomClient}} </td>
                </ng-container>
                <ng-container matColumnDef="raisonSociale">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by name">
                    Raison sociale
                    </th>
                    <td mat-cell *matCellDef="let element"> {{element.raisonSociale}} </td>
                </ng-container>
                <ng-container matColumnDef="dateCreation">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by name">
                    Date création
                    </th>
                    <td mat-cell *matCellDef="let element"> {{element.dateCreation}} </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
        </div>
        
        <div class="col-md-7" style="padding-bottom: 25px;">
            <ngx-extended-pdf-viewer [src]="pdfSrc" height="80vh"  [zoom]="'auto'"></ngx-extended-pdf-viewer>
