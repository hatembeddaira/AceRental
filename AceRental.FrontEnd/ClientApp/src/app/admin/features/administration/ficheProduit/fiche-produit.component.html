<div class="container-xl" [formGroup]="produitForm">
    <h2>Fiche produit [ {{produit.reference}} ]</h2>
    <div class="row">
        <div class="col-md-8">
            <div class="row">
                <div class="col-md-6">
                    <mat-form-field class="example-full-width" >
                        <mat-label>Référence</mat-label>
                        <input matInput type="text" placeholder="" formControlName="reference">
                        <mat-error *ngIf="hasError('reference', 'required')">
                            La référence est obligatoire
                        </mat-error>
                    </mat-form-field>
                </div>
                <div class="col-md-6">
                    <mat-form-field class="example-full-width" >
                        <mat-label>Libelle</mat-label>
                        <input matInput type="text" placeholder="" formControlName="libelle">
                        <mat-error *ngIf="hasError('libelle', 'required')">
                            Le libelle est obligatoire
                        </mat-error>
                    </mat-form-field>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12">
                    <mat-form-field class="example-full-width" >
                        <mat-label>Description</mat-label>
                        <textarea matInput cdkTextareaAutosize cdkAutosizeMinRows="1" cdkAutosizeMaxRows="5" placeholder="" formControlName="description"></textarea>
                    </mat-form-field>
                </div>
            </div>
            <div class="row">        
                <div class="col-md-12">
                    <mat-form-field class="example-full-width" >
                        <mat-label>Présentation</mat-label>
                        <textarea matInput cdkTextareaAutosize cdkAutosizeMinRows="1" cdkAutosizeMaxRows="5" placeholder="" formControlName="presentation"></textarea>
                    </mat-form-field>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12">
                    <mat-form-field class="example-full-width" >
                        <mat-label>Caractéristiques</mat-label>
                        <input matInput type="text" placeholder="" formControlName="caracteristiques">
                    </mat-form-field>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <mat-form-field class="example-full-width" >
                        <mat-label>Prix</mat-label>
                        <input matInput type="number" placeholder="" formControlName="prix">
                        <mat-error *ngIf="hasError('prix', 'required')">
                            Le prix est obligatoire
                        </mat-error>
                    </mat-form-field>
                </div>
                <div class="col-md-6">
                    <!-- <mat-form-field class="example-full-width" >
                        <mat-label>Image</mat-label>
                        <input matInput type="file" placeholder="" accept="image/*" formControlName="image">
                        <mat-error *ngIf="hasError('image', 'required')">
                            L'image est obligatoire
                        </mat-error>
                    </mat-form-field> -->
                    <mat-form-field style="width: 100%;    margin: 15px 0 0 0;">
                        <mat-label>Upload Images</mat-label>
                        <button mat-icon-button matPrefix (click)="f_input.click()">
                            <mat-icon>attach_file</mat-icon>
                        </button>
                        <input type="text" readonly matInput />
                        <input type="file" multiple hidden #f_input accept="image/*"  formControlName="images" (change)="handleFileInputChange($event)" />
                        <mat-error *ngIf="hasError('images', 'required')">
                            Le champ images est obligatoire
                        </mat-error>
                    </mat-form-field>
                </div>
            </div>
        </div>
        <div class="col-md-4 card border-dark mb-3" style="background-color: white;">
            <div id="carouselExampleDark" class="carousel carousel-dark slide">
                <div class="carousel-inner" >
                    <div class="carousel-item" *ngFor="let img of produit.images; let i = index" [ngClass]="{'active': i === 0}">
                        <div class="image">
                            <img [src]="img" alt="...">
                        </div>
                    </div>
                </div>
                
                <div class="carousel-indicators">
                    <button 
                        *ngFor="let img of produit.images; let i = index"
                        type="button" 
                        data-bs-target="#carouselExampleDark" 
                        [attr.data-bs-slide-to]="i" 
                        [class.active]="i === 0" 
                        [attr.aria-current]="i === 0 ? 'true' : null" 
                        [attr.aria-label]="'Slide ' + (i + 1)">
                    </button>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleDark" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleDark" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>
    </div>

    <div class="row" style="justify-content: flex-end;">
        <button type="button" 
            class="btn btn-yellow effect btn-xs" 
            style="margin: 15px 12px 0 0;width: 250px;" 
            (click)="submit()"
            [disabled]="produitForm.invalid">Valider les modifications</button>
        <button type="button" 
            class="btn btn-dark effect btn-xs" 
            style="margin: 15px 12px 0 0;width: 250px;"
            (click)="reset()">Annuler les modifications</button>
    </div>
</div>
