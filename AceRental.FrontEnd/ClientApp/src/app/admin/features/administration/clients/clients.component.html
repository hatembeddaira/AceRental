<div class="container-xxl">
    <h2>Liste des clients </h2>
    <table mat-table [dataSource]="dataSource" matSort (matSortChange)="announceSortChange($event)" class="mat-elevation-z8">
        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by id">
            N° Client
            </th>
            <td mat-cell *matCellDef="let element">{{element.id}}</td>
        </ng-container>        
        <ng-container matColumnDef="raisonSociale">
            <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by raisonSociale">
            Raison sociale
            </th>
            <td mat-cell *matCellDef="let element"> {{element.raisonSociale}} </td>
        </ng-container>
        <ng-container matColumnDef="nomClient">
            <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by nomClient">
            Nom Client
            </th>
            <td mat-cell *matCellDef="let element">{{element.nomClient}}</td>
        </ng-container>
        <ng-container matColumnDef="prenomClient">
            <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by prenomClient">
            Prénom Client
            </th>
            <td mat-cell *matCellDef="let element"> {{element.prenomClient}} </td>
        </ng-container>
        <ng-container matColumnDef="dateCreation">
            <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by dateCreation">
            Date création
            </th>
            <td mat-cell *matCellDef="let element"> {{element.dateCreation.toLocaleDateString()}} </td>
        </ng-container>
        <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by email">
            Email
            </th>
            <td mat-cell *matCellDef="let element"> {{element.email}} </td>
        </ng-container>
        <ng-container matColumnDef="edit">
            <th mat-header-cell *matHeaderCellDef ></th>
            <td mat-cell *matCellDef="let element">
                <a type="button" [routerLink]="['/admin/administration/client/', element.id]" target="_blank" class="btn btn-dark effect btn-xs">Afficher</a>
            </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</div>
