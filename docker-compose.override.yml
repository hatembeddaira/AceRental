services:
  acerental-api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
    ports:
      - "5000:5000"
    volumes:
      - .:/src  # hot reload possible
  acerental-frontend:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:3000
      # - ASPNETCORE_HTTP_PORTS=80
    ports:
      - "3000:3000"
  acerental-angular:
    ports:
      - "4200:4200"
    volumes:
      - ../AceRental.FrontEnd/ClientApp:/app
      - /app/node_modules